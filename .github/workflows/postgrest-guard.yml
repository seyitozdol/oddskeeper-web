name: postgrest-guard

# PostgREST 1000-cap bekcisi (C-2, 2026-08-20): .limit(N>1000) yasak (sessizce
# kirpilir); sinirlayicisiz .from() zinciri ratchet baseline'i asamaz.
# Detay: .github/scripts/check_postgrest_limits.py
on:
  push:
  pull_request:

jobs:
  postgrest-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PostgREST limit taramasi
        run: python3 .github/scripts/check_postgrest_limits.py
